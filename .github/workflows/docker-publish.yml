
name: Veltrix CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test, Build and Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app.py

      - name: Build Docker image
        run: docker build -t veltrix:ci .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD}}

      - name: Tag Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag veltrix:ci amxnn/veltrix:1.0
          docker tag veltrix:ci amxnn/veltrix:latest
          docker tag veltrix:ci amxnn/veltrix:${{ github.sha }}

      - name: Push Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push amxnn/veltrix:1.0
          docker push amxnn/veltrix:latest
          docker push amxnn/veltrix:${{ github.sha }}

  deploy:
    name: Deploy to kind-veltrix Kubernetes
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Kubernetes access
        run: |
          kubectl --context kind-veltrix get nodes
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot access kind-veltrix."
          }

      - name: Verify Veltrix deployment
        run: |
          kubectl --context kind-veltrix get deployment veltrix
          if ($LASTEXITCODE -ne 0) {
            throw "Veltrix deployment was not found."
          }

      
      - name: Pull exact commit image from Docker Hub
        shell: powershell
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          $env:DOCKERHUB_PASSWORD |
            docker login --username $env:DOCKERHUB_USERNAME --password-stdin

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Hub login failed on the deployment runner."
          }

          docker pull "amxnn/veltrix:$env:IMAGE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to pull the image from Docker Hub."
          }

          kind load docker-image "amxnn/veltrix:$env:IMAGE_TAG" --name veltrix
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to load the image into kind."
          }

      - name: Deploy exact commit image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl --context kind-veltrix set image deployment/veltrix "veltrix=amxnn/veltrix:$env:IMAGE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update the Veltrix image."
          }

      - name: Wait for deployment rollout
        run: |
          kubectl --context kind-veltrix rollout status deployment/veltrix --timeout=180s
          if ($LASTEXITCODE -ne 0) {
            throw "Veltrix deployment rollout failed."
          }

      - name: Verify deployment and HPA
        run: |
          kubectl --context kind-veltrix get deployment veltrix
          if ($LASTEXITCODE -ne 0) { throw "Deployment verification failed." }

          kubectl --context kind-veltrix get pods
          if ($LASTEXITCODE -ne 0) { throw "Pod verification failed." }

          kubectl --context kind-veltrix get service veltrix-service
          if ($LASTEXITCODE -ne 0) { throw "Service verification failed." }

          kubectl --context kind-veltrix get hpa veltrix
          if ($LASTEXITCODE -ne 0) { throw "HPA verification failed." }

      - name: Notify Slack after successful deployment
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          IMAGE_NAME: amxnn/veltrix:${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SLACK_WEBHOOK_URL)) {
            throw "SLACK_WEBHOOK_URL secret is missing."
          }

          $payload = @{
            text = "Veltrix deployment succeeded! Image: $env:IMAGE_NAME. Commit: $env:COMMIT_SHA. Repository: $env:REPOSITORY. Run: $env:RUN_URL"
          } | ConvertTo-Json -Compress

          Invoke-RestMethod `
            -Uri $env:SLACK_WEBHOOK_URL `
            -Method Post `
            -ContentType "application/json" `
            -Body $payload
