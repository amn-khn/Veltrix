
name: Veltrix CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI - Build and Push Docker Image
    runs-on: [self-hosted, Windows, X64]

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tools and Kubernetes access
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($tool in @("docker", "kubectl", "kind")) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "$tool is missing or unavailable in PATH."
            }
          }

          kubectl --context kind-veltrix get nodes
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot access kind-veltrix."
          }

      - name: Log in to Docker Hub
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME) -or
              [string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN)) {
            throw "Docker Hub credentials are missing."
          }

          $env:DOCKERHUB_TOKEN |
            docker login --username $env:DOCKERHUB_USERNAME --password-stdin

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Hub login failed. Check the GitHub Secrets."
          }

      - name: Build Docker image
        id: image
        shell: powershell
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $tag = $env:COMMIT_SHA
          $image = "amxnn/veltrix:$tag"

          docker build --pull -t $image .
          if ($LASTEXITCODE -ne 0) {
            throw "Docker build failed."
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Push image to Docker Hub
        shell: powershell
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "amxnn/veltrix:$env:IMAGE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Pushing the versioned image failed."
          }

          docker tag "amxnn/veltrix:$env:IMAGE_TAG" amxnn/veltrix:latest
          if ($LASTEXITCODE -ne 0) {
            throw "Tagging latest failed."
          }

          docker push amxnn/veltrix:latest
          if ($LASTEXITCODE -ne 0) {
            throw "Pushing latest failed."
          }

  cd:
    name: CD - Deploy to Kubernetes
    needs: ci
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Load image into kind
        shell: powershell
        env:
          IMAGE_TAG: ${{ needs.ci.outputs.image_tag }}
        run: |
          kind load docker-image "amxnn/veltrix:$env:IMAGE_TAG" --name veltrix
          if ($LASTEXITCODE -ne 0) {
            throw "Loading image into kind failed."
          }

      - name: Deploy Veltrix
        shell: powershell
        env:
          IMAGE_TAG: ${{ needs.ci.outputs.image_tag }}
        run: |
          kubectl --context kind-veltrix set image deployment/veltrix "veltrix=amxnn/veltrix:$env:IMAGE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Updating the deployment image failed."
          }

          kubectl --context kind-veltrix rollout status deployment/veltrix --timeout=180s
          if ($LASTEXITCODE -ne 0) {
            throw "Kubernetes rollout failed."
          }

          kubectl --context kind-veltrix get deployment veltrix
          kubectl --context kind-veltrix get pods

  notify:
    name: Notify Slack
    needs: [ci, cd]
    if: always()
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Send CI/CD result to Slack
        shell: powershell
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CI_RESULT: ${{ needs.ci.result }}
          CD_RESULT: ${{ needs.cd.result }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SLACK_WEBHOOK_URL)) {
            throw "SLACK_WEBHOOK_URL secret is missing."
          }

          if ($env:CI_RESULT -eq "success" -and $env:CD_RESULT -eq "success") {
            $message = "✅ Veltrix CI/CD succeeded. Image amxnn/veltrix:$env:COMMIT_SHA deployed to kind-veltrix."
          } else {
            $message = "❌ Veltrix CI/CD failed. CI: $env:CI_RESULT; CD: $env:CD_RESULT. Check https://github.com/amn-khn/Veltrix/actions"
          }

          $body = @{ text = $message } | ConvertTo-Json -Compress

          Invoke-RestMethod -Uri $env:SLACK_WEBHOOK_URL `
            -Method Post `
            -ContentType "application/json" `
            -Body $body
