name: Veltrix Docker CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push-deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $env:DOCKERHUB_TOKEN | docker login -u $env:DOCKERHUB_USERNAME --password-stdin
          if ($LASTEXITCODE -ne 0) { throw "Docker Hub login failed" }

      - name: Build and push Veltrix image
        shell: powershell
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "amxnn/veltrix:$env:IMAGE_TAG" -t "amxnn/veltrix:latest" .
          if ($LASTEXITCODE -ne 0) { throw "Docker build failed" }

          docker push "amxnn/veltrix:$env:IMAGE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Docker image push failed" }

          docker push "amxnn/veltrix:latest"
          if ($LASTEXITCODE -ne 0) { throw "Docker latest push failed" }

      - name: Load image into kind
        shell: powershell
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kind load docker-image "amxnn/veltrix:$env:IMAGE_TAG" --name veltrix
          if ($LASTEXITCODE -ne 0) { throw "Loading image into kind failed" }

      - name: Deploy to Kubernetes
        shell: powershell
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl --context kind-veltrix set image deployment/veltrix "veltrix=amxnn/veltrix:$env:IMAGE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Updating deployment image failed" }

          kubectl --context kind-veltrix rollout status deployment/veltrix --timeout=180s
          if ($LASTEXITCODE -ne 0) { throw "Kubernetes rollout failed" }

      - name: Notify Slack on success
        if: success()
        shell: powershell
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $body = @{ text = "✅ Veltrix CI/CD succeeded! Image amxnn/veltrix:$env:COMMIT_SHA deployed to kind-veltrix. Commit: $env:COMMIT_SHA" } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri $env:SLACK_WEBHOOK_URL -Method Post -ContentType "application/json" -Body $body

      - name: Notify Slack on failure
        if: failure()
        shell: powershell
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          $body = @{ text = "❌ Veltrix CI/CD failed. Check GitHub Actions: https://github.com/amn-khn/Veltrix/actions" } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri $env:SLACK_WEBHOOK_URL -Method Post -ContentType "application/json" -Body $body
