
name: Veltrix CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: CI - Test, Build and Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app.py

      - name: Build Docker image
        run: docker build -t veltrix:ci .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Tag Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag veltrix:ci amxnn/veltrix:1.0
          docker tag veltrix:ci amxnn/veltrix:latest
          docker tag veltrix:ci "amxnn/veltrix:${IMAGE_TAG}"

      - name: Push Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push amxnn/veltrix:1.0
          docker push amxnn/veltrix:latest
          docker push "amxnn/veltrix:${IMAGE_TAG}"

  deploy:
    name: CD - Deploy to kind-veltrix
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell

    steps:
      - name: Verify required tools
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($tool in @("docker", "kubectl", "kind")) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "$tool is not installed or is missing from PATH."
            }
          }

      - name: Verify Kubernetes cluster
        run: |
          kubectl --context kind-veltrix get nodes
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot access kind-veltrix. Ensure Docker Desktop and the kind cluster are running."
          }

      - name: Verify Veltrix resources
        run: |
          kubectl --context kind-veltrix get deployment veltrix
          if ($LASTEXITCODE -ne 0) {
            throw "Deployment veltrix was not found."
          }

          kubectl --context kind-veltrix get service veltrix-service
          if ($LASTEXITCODE -ne 0) {
            throw "Service veltrix-service was not found."
          }

      - name: Log in to Docker Hub
        env:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME) -or
              [string]::IsNullOrWhiteSpace($env:DOCKERHUB_PASSWORD)) {
            throw "Docker Hub credentials are missing."
          }

          $env:DOCKERHUB_PASSWORD |
            docker login --username $env:DOCKERHUB_USERNAME --password-stdin

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Hub login failed on the deployment runner."
          }

      - name: Pull exact commit image from Docker Hub
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker pull "amxnn/veltrix:$env:IMAGE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to pull the CI image from Docker Hub."
          }

      - name: Load image into kind
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kind load docker-image "amxnn/veltrix:$env:IMAGE_TAG" --name veltrix
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to load the image into kind."
          }

      - name: Deploy exact commit image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl --context kind-veltrix set image deployment/veltrix "veltrix=amxnn/veltrix:$env:IMAGE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update the Veltrix deployment."
          }

      - name: Wait for rollout
        run: |
          kubectl --context kind-veltrix rollout status deployment/veltrix --timeout=180s
          if ($LASTEXITCODE -ne 0) {
            throw "Veltrix rollout failed."
          }

      - name: Verify deployment, service and HPA
        run: |
          kubectl --context kind-veltrix get deployment veltrix
          if ($LASTEXITCODE -ne 0) { throw "Deployment verification failed." }

          kubectl --context kind-veltrix get pods
          if ($LASTEXITCODE -ne 0) { throw "Pod verification failed." }

          kubectl --context kind-veltrix get service veltrix-service
          if ($LASTEXITCODE -ne 0) { throw "Service verification failed." }

          kubectl --context kind-veltrix get hpa veltrix
          if ($LASTEXITCODE -ne 0) { throw "HPA verification failed." }

  notify:
    name: Notify Slack
    needs: [test-and-build, deploy]
    if: always() && github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Send CI/CD result to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CI_RESULT: ${{ needs.test-and-build.result }}
          CD_RESULT: ${{ needs.deploy.result }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SLACK_WEBHOOK_URL)) {
            throw "SLACK_WEBHOOK_URL secret is missing."
          }

          if ($env:CI_RESULT -eq "success" -and $env:CD_RESULT -eq "success") {
            $message = "SUCCESS: Veltrix CI/CD completed. Image: amxnn/veltrix:$env:COMMIT_SHA. Run: $env:RUN_URL"
          } else {
            $message = "FAILED: Veltrix CI=$env:CI_RESULT; CD=$env:CD_RESULT. Run: $env:RUN_URL"
          }

          $payload = @{ text = $message } | ConvertTo-Json -Compress

          Invoke-RestMethod `
            -Uri $env:SLACK_WEBHOOK_URL `
            -Method Post `
            -ContentType "application/json" `
            -Body $payload
